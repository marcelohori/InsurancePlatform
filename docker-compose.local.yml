# Overlay local-only: expõe as portas de Postgres/RabbitMQ no host para permitir rodar os
# serviços diretamente com `dotnet run` (fora da rede Docker) durante o desenvolvimento.
#
# NÃO é aplicado por um `docker compose up` normal - é preciso referenciá-lo explicitamente:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d postgres rabbitmq
#
# Nunca use este overlay em produção: o docker-compose.yml principal mantém essas portas
# fechadas de propósito (Postgres e RabbitMQ só devem ser acessíveis de dentro da rede Docker).
services:
  postgres:
    # Host port 5433 (não 5432) porque 5432 pode já estar ocupado por outra instância de
    # Postgres na sua máquina (outro projeto, um Postgres instalado localmente, etc.) - dentro
    # da rede Docker os outros serviços deste projeto continuam falando com "postgres:5432"
    # normalmente, isso só muda como você acessa do host (dotnet run, psql local).
    ports:
      - "5433:5432"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
